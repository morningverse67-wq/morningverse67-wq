<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="morningverse. Small ideas, useful tools.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101C34"/><stop offset="1" stop-color="#26344E"/></linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FFE2BD"/><stop offset="1" stop-color="#EE9E91"/></linearGradient>
    <linearGradient id="haze"><stop stop-color="#E8B6A0" stop-opacity="0"/><stop offset=".5" stop-color="#E8B6A0" stop-opacity=".2"/><stop offset="1" stop-color="#E8B6A0" stop-opacity="0"/></linearGradient>
    <clipPath id="card"><rect width="1200" height="360" rx="24"/></clipPath>
    <clipPath id="sky"><rect width="1200" height="258"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <circle cx="974" cy="251" r="174" fill="none" stroke="#E9B7A1" stroke-opacity=".1"/>
    <circle cx="974" cy="251" r="137" fill="none" stroke="#E9B7A1" stroke-opacity=".16"/>
    <g clip-path="url(#sky)"><circle cx="974" cy="253" r="98" fill="url(#sun)"/></g>
    <path d="M728 258H1200" stroke="#E9B7A1" stroke-opacity=".35"/>
    <path d="M774 278H1174M820 298H1128M872 318H1076" stroke="url(#haze)" stroke-width="3"/>
    <circle cx="840" cy="98" r="2" fill="#E7CAB6"/><circle cx="1100" cy="72" r="2.5" fill="#E7CAB6"/>
    <path d="M923 59v10m-5-5h10" stroke="#E7CAB6" stroke-opacity=".5"/>
    <rect x="64" y="58" width="250" height="30" rx="15" fill="#F4C6AE" fill-opacity=".09" stroke="#F4C6AE" stroke-opacity=".2"/>
    <text x="189" y="78" text-anchor="middle" fill="#F4C6AE" font-family="Arial,sans-serif" font-size="11" letter-spacing="2.5">A LITTLE BETTER, EVERY DAY</text>
    <text x="60" y="180" fill="#FAF3E9" font-family="Arial,Helvetica,sans-serif" font-size="82" font-weight="700" letter-spacing="-4">morningverse<tspan fill="#F0B69C">.</tspan></text>
    <text x="65" y="226" fill="#BBC6D7" font-family="Arial,sans-serif" font-size="22" letter-spacing=".4">Small ideas. Useful tools. Steady progress.</text>
